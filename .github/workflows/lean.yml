# The external judge (annex XXXIX). Changing this file is an integrity event (annex 39.5):
# log it in LEDGER.md, and never weaken a check without Alexander's explicit approval.
name: Lean judge

on:
  push:
  pull_request:
  workflow_dispatch:

# Run 2026-11-07T0428Z (annex LIV, integrity event 39.5, see LEDGER): at most one running and one queued job per ref.
# A running job is never cancelled; a newer push replaces an older job that has not started. Nothing goes unchecked:
# the base-diff checks diff against the newest green ancestor (changes job), which covers every replaced commit.
# Run 2026-11-07T0628Z (39.5, see LEDGER): the coalescing moved from the whole run to each heavy job (work, checked,
# each nanoda shard), so a nanoda shard of hours no longer holds back the work and checked jobs of later commits
# (run 42343274596: shards 0 and 3 still running after 2 h kept 77803a1's successors queued). A run is green only
# when every job of it is green, as before.

permissions:
  contents: read
  actions: read

jobs:
  changes:
    # Run 2026-11-07T0428Z (annex LIV, integrity event 39.5, see LEDGER): CI saturation. Queued runs are coalesced
    # per ref (workflow-level concurrency), so the base of every base-diff check is no longer github.event.before but the
    # newest ancestor whose whole run was green (scripts/ci_changes.py; fail-closed). A push whose tree differs
    # from that green ancestor only in LOCK (a heartbeat) skips the Lean jobs (shown as skipped, never green).
    name: changes (diff base = newest green ancestor; LOCK-only heartbeats skip the Lean jobs)
    runs-on: ubuntu-latest
    outputs:
      base: ${{ steps.d.outputs.base }}
      lock_only: ${{ steps.d.outputs.lock_only }}
      checked_hash: ${{ steps.d.outputs.checked_hash }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: d
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/ci_changes.py --selftest
          python3 scripts/ci_changes.py >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  goal-guard:
    name: goal guard (the goal and the no-narrowing instruction must not be lost; 2026-10-31, see LEDGER)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: python3 scripts/goal_guard.py
      - name: No tracked symlinks outside _archive (a committed .lake symlink broke every lake checkout; run 2026-11-08T2028Z, see LEDGER)
        run: |
          bad=$(git ls-files -s | awk '$1 == "120000" {print $4}' | grep -v '^_archive/' || true)
          if [ -n "$bad" ]; then echo "tracked symlinks: $bad"; exit 1; fi
      - name: Planted controls of the blind-reading route (P3 route) and of P12 in scratch git repositories (blocking; run 2026-11-09T1428Z, see LEDGER)
        run: |
          git config --global user.email ci@example.invalid
          git config --global user.name ci
          python3 scripts/trust/route_control.py
      - name: FINDINGS.md rendered with a pinned CommonMark renderer has the structure the line rules assume; candidate pointers bound; GitHub's cmark-gfm shows the same (FB21, FB22, FB23; blocking; runs 2026-11-14T2028Z, 2026-11-15T0428Z, see LEDGER)
        run: |
          for i in 1 2 3 4 5; do python3 -m pip install --user --break-system-packages markdown-it-py==4.2.0 cmarkgfm==2024.11.20 && break; sleep 15; done
          python3 scripts/trust/check_findings.py --render
      - name: The verified-findings page a reader reads is generated with no author prose (FB26; blocking; run 2026-11-15T1628Z, blind readers took an unchecked withdrawal note over the generated part 6/6, see LEDGER)
        run: |
          python3 scripts/trust/make_verified_page.py --selftest
          python3 scripts/trust/make_verified_page.py --check

  validation-packet:
    name: expert-validation packet is current, or frozen once sent (THE RESULT part 4; run 2026-10-31T0828Z, see LEDGER)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - run: python3 validation/make_packet.py --check

  work:
    name: work (drafts, sorry allowed)
    concurrency:
      group: lean-judge-work-${{ github.ref }}
      cancel-in-progress: false
    needs: changes
    if: needs.changes.outputs.lock_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Robust elan download (curl retries via ~/.curlrc; the elan installer's releases/latest URL is served from the pinned elan release v4.2.4; robustness only, no check changes; runs 2026-11-08T0828Z, see LEDGER)
        run: |
          printf 'retry = 12\nretry-delay = 15\nretry-connrefused\n' >> "$HOME/.curlrc"
          mkdir -p "$HOME/.ci-shim"
          REAL="$(command -v curl)"
          printf '#!/usr/bin/env bash\nargs=()\nfor a in "$@"; do args+=("${a//\\/leanprover\\/elan\\/releases\\/latest\\/download\\//\\/leanprover\\/elan\\/releases\\/download\\/v4.2.4\\/}"); done\nexec %s "${args[@]}"\n' "$REAL" > "$HOME/.ci-shim/curl"
          chmod +x "$HOME/.ci-shim/curl"
          echo "$HOME/.ci-shim" >> "$GITHUB_PATH"
          cat "$HOME/.ci-shim/curl"
      - name: Pre-install the pinned Lean toolchain with retries (elan's own downloader ignores ~/.curlrc; releases.lean-lang.org timed out on 2026-11-08; robustness only, no check changes; run 2026-11-08T1028Z, see LEDGER)
        run: |
          export PATH="$HOME/.ci-shim:$PATH"
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o "$RUNNER_TEMP/elan-init.sh" || true
          sh "$RUNNER_TEMP/elan-init.sh" -y --default-toolchain none || true
          for i in $(seq 1 10); do
            if "$HOME/.elan/bin/elan" toolchain install "$(cat lean-toolchain)"; then break; fi
            echo "toolchain download failed (attempt $i of 10); retrying in 30 s"; sleep 30
          done
      # Run 2026-11-20T1228Z (annex LIV; robustness/speed only, no check changes; see LEDGER): this job restores the
      # lake cache but no longer saves it. lean-action saves `.lake` under one key per commit and the first job to
      # finish its build wins the key; that was always this job (≈ 5 min), whose `.lake` holds only what Work imports,
      # so the ≈ 85 Checked modules Work does not import (the kernel-decided data modules among them) were never in
      # the cache and all nine judge jobs rebuilt them on every push, one at a time (LEAN_NUM_THREADS=1): 24-33 min of
      # each job's 60-100 min (CI 44698202534: 83-88 modules, build steps 1427-1952 s, the lake cache of every commit
      # saved by `work`). Now a job that builds all of Checked saves the key. Same restore key as lean-action's own.
      - name: Restore the lake cache (restore only; the judge jobs save it)
        uses: actions/cache/restore@v4
        with:
          path: ./.lake
          key: lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-${{ github.sha }}
          restore-keys: lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}
      - uses: leanprover/lean-action@v1.7.0
        with:
          use-mathlib-cache: "true"
          use-github-cache: "false"
          build-args: "Work"
      - name: Closed audits stay closed (blocking; run 2026-11-04T1028Z, red team G, see LEDGER)
        env:
          BASE: ${{ needs.changes.outputs.base }}
        run: |
          # every theorem listed in scripts/trust/audits.txt (closed audit theorems of Work/**/*Audit*.lean)
          # still exists and uses only the standard axioms (no sorryAx); the list may only shrink with a LEDGER line
          lake env lean scripts/trust/AuditClosed.lean
          python3 scripts/trust/check_audits.py "$BASE"

  checked:
    name: checked (strict)
    concurrency:
      group: lean-judge-checked-${{ github.ref }}
      cancel-in-progress: false
    needs: changes
    if: needs.changes.outputs.lock_only != 'true'
    runs-on: ubuntu-latest
    # Repair, run 2026-11-12T1028Z (annex LIV, see LEDGER): the checked job of f789e4d (run 43175455329) sat in the
    # build step for 4 h (green checked jobs take 35-100 min) and, with the per-ref concurrency group, held every later
    # main checked job in "pending" until GitHub's 6 h default. A hung job now fails (red, never green) after 240 min (an uncached full build is ≈ 110–150 min).
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # Repair, run 2026-11-05T1628Z (annex LIV, see LEDGER): three checked jobs were lost without a log
      # (ff010a6 and 70d33e3 in nanoda, 01b0c8c in the build) on trees that passed elsewhere — the
      # signature of the runner VM dying on memory or disk. Free unused toolchains and add swap; no
      # check changes. The resource report is printed again after nanoda.
      - name: Free disk and add swap (robustness; no check changes)
        run: |
          df -h / ; free -h
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL || true
          sudo fallocate -l 8G /extra-swap && sudo chmod 600 /extra-swap && sudo mkswap /extra-swap && sudo swapon /extra-swap || echo "swap not added"
          df -h / ; free -h
      - name: Robust elan download (curl retries via ~/.curlrc; the elan installer's releases/latest URL is served from the pinned elan release v4.2.4; robustness only, no check changes; runs 2026-11-08T0828Z, see LEDGER)
        run: |
          printf 'retry = 12\nretry-delay = 15\nretry-connrefused\n' >> "$HOME/.curlrc"
          mkdir -p "$HOME/.ci-shim"
          REAL="$(command -v curl)"
          printf '#!/usr/bin/env bash\nargs=()\nfor a in "$@"; do args+=("${a//\\/leanprover\\/elan\\/releases\\/latest\\/download\\//\\/leanprover\\/elan\\/releases\\/download\\/v4.2.4\\/}"); done\nexec %s "${args[@]}"\n' "$REAL" > "$HOME/.ci-shim/curl"
          chmod +x "$HOME/.ci-shim/curl"
          echo "$HOME/.ci-shim" >> "$GITHUB_PATH"
          cat "$HOME/.ci-shim/curl"
      - name: Pre-install the pinned Lean toolchain with retries (elan's own downloader ignores ~/.curlrc; releases.lean-lang.org timed out on 2026-11-08; robustness only, no check changes; run 2026-11-08T1028Z, see LEDGER)
        run: |
          export PATH="$HOME/.ci-shim:$PATH"
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o "$RUNNER_TEMP/elan-init.sh" || true
          sh "$RUNNER_TEMP/elan-init.sh" -y --default-toolchain none || true
          for i in $(seq 1 10); do
            if "$HOME/.elan/bin/elan" toolchain install "$(cat lean-toolchain)"; then break; fi
            echo "toolchain download failed (attempt $i of 10); retrying in 30 s"; sleep 30
          done
      - uses: leanprover/lean-action@v1.7.0
        env:
          LEAN_NUM_THREADS: "1"
        with:
          use-mathlib-cache: "true"
          build-args: "Checked"
          axiom-audit: "true"
          axiom-audit-allow: "propext,Classical.choice,Quot.sound"
          axiom-audit-root: "Checked"
          # Run 2026-11-18T1828Z (annex LIV, integrity event 39.5, see LEDGER): the leanchecker replay of Checked
          # (`lake env leanchecker Checked`, 140 min single-threaded in job 134891775171) moved to the job
          # `leanchecker` below, split into four shards that partition the module list; same binary, same check.
          leanchecker: "false"
      - name: No sorry / axiom / native_decide in Checked sources (belt and braces)
        run: |
          if grep -rnE '\b(sorry|admit|axiom|native_decide|implemented_by|debug\.skipKernelTC)\b' Checked Checked.lean; then
            echo "Forbidden token found in Checked"; exit 1
          fi
      - name: Pinned Markdown renderers for check_findings.py FB21 and FB23 (markdown-it-py, GitHub's cmark-gfm; the checks fail closed without them; runs 2026-11-14T2028Z, 2026-11-15T0428Z)
        run: |
          for i in 1 2 3 4 5; do python3 -m pip install --user --break-system-packages markdown-it-py==4.2.0 cmarkgfm==2024.11.20 && break; sleep 15; done
      - name: Statement dependencies, trust map, non-vacuity witnesses, pin shape, frozen registry, unused hypotheses, records, certified numbers, prose/meaning (all blocking; runs 2028Z, 2228Z, 2026-10-31T0028Z, 0228Z, 1028Z, see LEDGER)
        run: |
          set -o pipefail
          lake env lean scripts/trust/StatementDeps.lean | tail -n 40
          # certified numbers in FINDINGS.md (run 2026-10-31T0228Z; reads .lake/records_numbers.tsv)
          python3 scripts/trust/check_numbers.py
          # verified findings bound to Lean: blocks to their section, printed values to statements and windows,
          # spelled-out sizes, uniqueness words (run 2026-11-12T2028Z, blind red team AI; reads CLAIMS.md)
          python3 scripts/trust/check_findings.py
          # the reader page VERIFIED_FINDINGS.md is FINDINGS.md's generated part only, current (FB26, run 2026-11-15T1628Z)
          python3 scripts/trust/make_verified_page.py --check
          # meaning carried by prose and names: docstrings, names and statement shape checked against
          # what the statement reaches (run 2026-10-31T1028Z; reads .lake/meaning.jsonl)
          python3 scripts/trust/check_prose.py
          # statement literals are certified targets, read twice (literal_readings.txt) or grandfathered (shrink-only
          # literal_baseline.txt); model/source names backed by what the statement reaches; claim templates of
          # generated readings frozen (run 2026-11-06T0228Z, written blind to red team M; reads .lake/meaning.jsonl)
          python3 scripts/trust/check_literals.py
          python3 scripts/trust/check_source_names.py
          python3 scripts/trust/check_templates.py
          # certified targets hold one number and value-mode readings count only at registered slots
          # (literal_slots.txt); source/model names in any spelling, backed by what the reader itself named; more
          # generalising words need universally bound data (run 2026-11-06T1028Z, check-writer blind to red team N's files, brief written after its report)
          python3 scripts/trust/check_literal_targets.py
          python3 scripts/trust/check_source_variants.py
          python3 scripts/trust/check_prose_gen.py
          # headline docstrings may not grade a model or source (reliable, accurate, agrees with experiment, ...; run 2026-11-06T1028Z, after round N)
          python3 scripts/trust/check_prose_eval.py
          # headline prose may not add a claim: no inference connective, no generality in the name, two-sided words need a
          # two-sided conclusion, persistence words need a bound time, more grading words (run 2026-11-06T1428Z, after round O)
          python3 scripts/trust/check_claim_words.py
          # pin claims in TRUSTED_DEFINITIONS.md must match scripts/trust/pins.txt (run 2026-11-04T0428Z, red team F)
          python3 scripts/trust/check_trusted_defs.py
          # the COMMITTED claims pages agree with the registries they print, judged before Claims.lean regenerates them,
          # so records_check.py catches a registry edited after the last Claims run (run 2026-11-25T0628Z, see LEDGER)
          python3 scripts/trust/check_claims_fresh.py --selftest
          python3 scripts/trust/check_claims_fresh.py
          # generated claims (run 2026-11-04T2228Z, LEDGER): CLAIMS.md is produced from the Lean
          # statements; the phrases of pinned definitions are its only hand-written words
          lake env lean scripts/trust/Claims.lean | tail -n 5
          python3 scripts/trust/check_claims.py
          if ! git diff --quiet -- CLAIMS.md; then
            echo "::error::CLAIMS.md in the repository is stale (blocking since run 2026-11-04T2228Z); regenerate with: lake env lean scripts/trust/Claims.lean"
            git diff --stat -- CLAIMS.md
            exit 1
          fi
          # CLAIMS_READER.md (run 2026-11-18T0828Z): CLAIMS.md without author paraphrases, the page the banners point to
          if ! git diff --quiet -- CLAIMS_READER.md || [ -n "$(git status --porcelain -- CLAIMS_READER.md)" ]; then
            echo "::error::CLAIMS_READER.md in the repository is stale or missing (blocking since run 2026-11-18T0828Z); regenerate with: lake env lean scripts/trust/Claims.lean"
            git status --short -- CLAIMS_READER.md
            exit 1
          fi
          # PHRASE_LINES.md (run 2026-11-09T1828Z, rule P13 of check_claims.py): the certified reader lines of the phrases
          # with their theorems' generated claims; generated by Claims.lean like CLAIMS.md
          if ! git diff --quiet -- PHRASE_LINES.md; then
            echo "::error::PHRASE_LINES.md in the repository is stale (blocking since run 2026-11-09T1828Z); regenerate with: lake env lean scripts/trust/Claims.lean"
            git diff --stat -- PHRASE_LINES.md
            exit 1
          fi
          if ! git diff --quiet -- TRUST_MAP.md; then
            echo "::error::TRUST_MAP.md in the repository is stale (blocking since run 2026-10-31T0028Z); regenerate with: lake env lean scripts/trust/StatementDeps.lean"
            git diff --stat -- TRUST_MAP.md
            exit 1
          fi
          # headline paraphrases use only the generated claim's words, function words and a disclosed vocabulary; no
          # conclusion certifies a Mathlib junk value; bare PROVED status lines in STATE.md name a Checked headline
          # (run 2026-11-06T2228Z, after blind red team P: deny-lists were routed around every round)
          python3 scripts/trust/check_claim_vocab.py
          python3 scripts/trust/check_status_lines.py
          # hypothesis necessity (T2b): every open hypothesis listed in necessity_open_baseline.txt; parser fails closed
          # (run 2026-11-11T0028Z, see LEDGER; adversary on the first draft: 7 holes, repaired before going live)
          python3 scripts/trust/check_necessity.py
          # prose claims that a hypothesis is essential/needed/redundant cite TRUST_MAP.md or a Checked.Trust witness
          # (run 2026-11-12T1228Z: a referee sentence "b < v_l is essential" in a module doc was false; shrink-only baseline)
          python3 scripts/trust/check_necessity_prose.py
      - name: Frozen statements and definitions change only with a LEDGER entry naming them (run 2026-10-31T0028Z)
        env:
          BASE: ${{ needs.changes.outputs.base }}
        run: |
          python3 scripts/trust/check_relock.py "$BASE"
          # certified numbers of FINDINGS.md may not be changed or downgraded silently (run 2026-10-31T0228Z)
          python3 scripts/trust/check_numbers.py --base "$BASE"
          # the check_findings baseline only shrinks (run 2026-11-12T2028Z)
          python3 scripts/trust/check_findings.py --base "$BASE"
          # the prose baseline may only shrink and the glossary only grow (run 2026-10-31T1028Z)
          python3 scripts/trust/check_prose.py --base "$BASE"
          # added or changed lines of TRUSTED_DEFINITIONS.md are disclosed in LEDGER (run 2026-11-04T1028Z, red team G)
          python3 scripts/trust/check_trusted_defs.py --base "$BASE"
          # phrases of pinned definitions (the hand-written words of CLAIMS.md) change only with a LEDGER line (run 2026-11-04T2228Z)
          python3 scripts/trust/check_claims.py --base "$BASE"
          # FORMULA second-formulation baseline may only shrink (run 2026-11-05T0828Z, red team J d03/d06)
          python3 scripts/trust/check_formulas.py --base "$BASE"
          # second readings/formulations: generated module reproducible, data-only substitution, no borrowed
          # program constants, reader's copy under runs/ next to its brief and committed first (run 2026-11-05T2228Z, round L)
          python3 scripts/trust/check_provenance.py --base "$BASE"
          # literal/source-name baselines only shrink, readings and templates change only with a LEDGER line; a new
          # reader file: brief, reading, Checked copy in three ordered commits, brief without the answer (run 2026-11-06T0228Z)
          python3 scripts/trust/check_literals.py --base "$BASE"
          python3 scripts/trust/check_source_names.py --base "$BASE"
          python3 scripts/trust/check_templates.py --base "$BASE"
          python3 scripts/trust/check_blind_route.py --selftest
          python3 scripts/trust/check_blind_route.py --base "$BASE"
          # baselines of the round-N rules only shrink, slot/alias registries change only with a LEDGER line or grow;
          # existing reader modules and runs/ reader files are frozen (a new reading needs a new reader file);
          # briefs may not hand over the answer as words, split digits, notation or digit fragments (run 2026-11-06T1028Z)
          python3 scripts/trust/check_literal_targets.py --base "$BASE"
          python3 scripts/trust/check_source_variants.py --base "$BASE"
          python3 scripts/trust/check_prose_gen.py --base "$BASE"
          python3 scripts/trust/check_reader_frozen.py --base "$BASE"
          python3 scripts/trust/check_brief_leak.py --base "$BASE"
          python3 scripts/trust/check_prose_eval.py --base "$BASE"
          python3 scripts/trust/check_claim_words.py --base "$BASE"
          python3 scripts/trust/check_claim_vocab.py --base "$BASE"
          # a NEEDED/REDUNDANT hypothesis never becomes open or "no obligation" again; new or renumbered headlines with open
          # hypotheses, and removed classified ones, are named in LEDGER; NEEDED + REDUNDANT never falls (run 2026-11-11T0028Z)
          python3 scripts/trust/check_necessity.py --base "$BASE"
          # new hand-written lines about a listed headline (STATE, README, BLUEPRINT, run-record front pages): closed
          # vocabulary, status only in templates, objections only with a registry entry; default flag (run 2026-11-18T1428Z)
          python3 scripts/trust/check_headline_mentions.py --base "$BASE"
      - name: Author files for runs without local Lean (generated output, not a check; run 2026-11-04T0028Z, see LEDGER)
        # When the run environment refuses a local Lean install (run 2026-11-04T0028Z), the files a
        # promotion must commit (TRUST_MAP.md, relocked frozen.txt, validation packet) can only be
        # generated here. They are printed (base64 tarball between markers) and uploaded; the run
        # still commits them itself, with the LEDGER line that check_relock.py requires.
        # Run 2026-11-12T1028Z: `!cancelled()` instead of `always()` (a cancelled hung job no longer spends its
        # remaining minutes generating files nobody reads; failed jobs still produce them).
        if: ${{ !cancelled() }}
        run: |
          set +e
          TRUST_RELOCK=1 lake env lean scripts/trust/StatementDeps.lean > /tmp/author-relock.log 2>&1
          tail -n 20 /tmp/author-relock.log
          lake env lean scripts/trust/Claims.lean > /tmp/author-claims.log 2>&1
          python3 validation/make_packet.py > /dev/null 2>&1
          tar czf /tmp/author-files.tgz CLAIMS.md CLAIMS_READER.md PHRASE_LINES.md TRUST_MAP.md scripts/trust/frozen.txt validation .lake/records_numbers.tsv .lake/records_params.tsv .lake/meaning.jsonl .lake/phrases.jsonl /tmp/author-relock.log 2>/dev/null
          echo "AUTHOR-FILES-BEGIN"
          base64 /tmp/author-files.tgz
          echo "AUTHOR-FILES-END"
          exit 0
      - name: Upload author files
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: author-files
          path: /tmp/author-files.tgz
      - name: Pack the judge's build of Checked for runs to restore (generated output, not a check; run 2026-11-12T0427Z, see LEDGER)
        # Annex LIV: every scheduled run starts in a fresh container and rebuilt all of Checked locally (60–100 min a
        # run; OOM-killed once). This packs the build the judge just made (.lake/build: oleans, ileans, ir, Lake's
        # hash traces) so a run restores it with scripts/restore_checked_build.sh and Lake rebuilds only modules
        # whose inputs changed. A restored build is a convenience for the run's own iteration, never evidence:
        # every push is still judged here from scratch. Placed after every check so it cannot delay or alter one,
        # and continue-on-error so that a packing or upload failure can never turn the judge red.
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          if [ -d .lake/build/lib/lean/Checked ]; then
            git rev-parse HEAD > .lake/build/CHECKED_BUILD_COMMIT
            tar -cf - .lake/build | zstd -q -T0 -12 -o "$RUNNER_TEMP/checked-build.tar.zst"
            ls -l "$RUNNER_TEMP/checked-build.tar.zst"
          else
            echo "no build of Checked to pack"
          fi
      - name: Upload the build of Checked
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: checked-build
          path: ${{ runner.temp }}/checked-build.tar.zst
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 14

  leanchecker:
    # Run 2026-11-18T1828Z (annex LIV, integrity event 39.5, see LEDGER). The kernel replay that lean-action ran
    # inside the checked job (`lake env leanchecker Checked`: every declaration of every Checked module replayed
    # from its imports) took 47 min on 2026-11-12 and 140 min on 2026-11-18, putting the checked job at
    # 180-211 min of its 240-min limit. The same replay now runs as four shards in parallel:
    # scripts/leanchecker_shard.py lists every tracked Checked module, shard i takes those whose FNV-1a hash is
    # i mod 4 (a partition; its selftest fails otherwise), and runs the toolchain's bundled leanchecker on them.
    # Run 2026-11-19T0228Z: a module listed in scripts/nanoda/shard_assignment.txt (generated from measured replay
    # times, scripts/nanoda/shard_times.txt) takes its listed shard instead, here and in the nanoda shards
