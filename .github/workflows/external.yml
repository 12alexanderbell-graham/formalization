# External replays (standing instruction 11, run 2026-11-26T1529Z; annex LIV experiment, see LEDGER).
# Strengthens the judge, weakens nothing: a separate workflow that replays outside results listed in
# validation/external_replays.txt, each in the outside project's own Lean and Mathlib pin (which the
# main judge, pinned to this repository's toolchain, cannot load). Per line: extract the import closure
# of the solution module, build it with the Mathlib cache, check that the solution proves the frozen
# challenge statement, `#print axioms`, leanchecker on every copied module, nanoda on the export of the
# matched theorem, and build the program's blind readings / closures / pins against the same pin.
name: External replay

on:
  workflow_dispatch:
    inputs:
      only:
        description: 'Run only the manifest lines whose name is in this space-separated list (empty: all)'
        required: false
        default: ''
  push:
    paths:
      - validation/external_replays.txt
      - scripts/external/**
      - .github/workflows/external.yml

permissions:
  contents: read

jobs:
  list:
    runs-on: ubuntu-latest
    outputs:
      names: ${{ steps.m.outputs.names }}
    steps:
      - uses: actions/checkout@v5
      - id: m
        run: |
          names=$(grep -v '^#' validation/external_replays.txt | grep -v '^\s*$' | cut -d'|' -f1 | sed 's/ *$//' | ONLY="${{ github.event.inputs.only }}" python3 -c "import json,os,sys; o=os.environ.get('ONLY','').split(); print(json.dumps([l.strip() for l in sys.stdin if l.strip() and (not o or l.strip() in o)]))")
          echo "names=$names" >> "$GITHUB_OUTPUT"
  replay:
    needs: list
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        name: ${{ fromJSON(needs.list.outputs.names) }}
    steps:
      - uses: actions/checkout@v5
      - name: Free disk and add swap
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL || true
          sudo fallocate -l 8G /extra-swap && sudo chmod 600 /extra-swap && sudo mkswap /extra-swap && sudo swapon /extra-swap || echo "swap not added"
      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o elan-init.sh
          sh elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Read this line of the manifest
        run: |
          python3 - "${{ matrix.name }}" >> "$GITHUB_ENV" <<'PY'
          import sys
          for l in open('validation/external_replays.txt'):
              if l.startswith('#') or not l.strip(): continue
              f = [x.strip() for x in l.rstrip('\n').split('|')]
              f += [''] * (8 - len(f))
              if f[0] == sys.argv[1]:
                  for k, v in zip(['X_NAME', 'X_URL', 'X_REV', 'X_SUB', 'X_SOL', 'X_CHAL', 'X_THMS', 'X_EXTRA'], f):
                      print(f'{k}={v}')
          PY
      - name: Fetch the outside project at its pinned revision
        run: |
          mkdir outside && cd outside && git init -q && git remote add origin "$X_URL"
          git fetch -q --depth 1 origin "$X_REV" && git checkout -q FETCH_HEAD
          echo "fetched $X_URL at $(git rev-parse HEAD)"
      # A closure too large to build within one job (S-cycleclique: 444 modules, still building after
      # 348 min in run 45862470764) continues from the previous job's build outputs: the build directory is
      # saved even when the replay step fails or times out, and restored by the next dispatch of the same
      # line at the same revision. Trust is unchanged: the oleans are our own earlier build of the same
      # sources, Lake rebuilds any module whose sources' hash differs, and leanchecker and nanoda re-check
      # the declarations in them independently.
      - name: Restore partial build of this line
        uses: actions/cache/restore@v4
        with:
          path: work/.lake/build
          key: ext-build-${{ matrix.name }}-${{ env.X_REV }}-${{ github.run_id }}
          restore-keys: ext-build-${{ matrix.name }}-${{ env.X_REV }}-
      - name: Replay (closure build, match, axioms, leanchecker, nanoda, program closures)
        timeout-minutes: 320
        run: LC_SKIP=1 NANODA=1 EXTRA="$X_EXTRA" bash scripts/external/replay.sh "outside/$X_SUB" work "$X_SOL" "$X_CHAL" $X_THMS
      # Run 2026-11-27T1428Z (annex LIV, see LEDGER): the build reaches the leanchecker shards as an artifact,
      # no longer through the Actions cache. Every line saved its closure build to the cache (repository limit
      # 10 GB, least recently used evicted first); on 2026-11-27 about thirty lines evicted the judge's own lake
      # cache, the checked job of 868eee2 found "Cache not found", rebuilt all of Checked single-threaded and was
      # cancelled by its 240-minute limit at module 3639 of 3862, so no judged push could go green. The cache is now
      # written only when the replay step did not succeed (a closure too large for one job continues from it on
      # the next dispatch, as before); the shards download the artifact of this run, or rebuild.
      - name: Hand the build to the leanchecker shards of this run (artifact, two days)
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ext-build-${{ matrix.name }}
          path: work/.lake/build
          retention-days: 2
          if-no-files-found: ignore
          include-hidden-files: true
      - name: Save the partial build for the next dispatch (only when the replay did not finish)
        if: failure() || cancelled()
        uses: actions/cache/save@v4
        with:
          path: work/.lake/build
          key: ext-build-${{ matrix.name }}-${{ env.X_REV }}-${{ github.run_id }}
  # leanchecker (the toolchain kernel's replay, second independent check) sharded over jobs (Alexander,
  # 2026-11-26): each shard restores the replay job's build directory and replays every 4th module of the
  # closure, so no runner holds more than a quarter of it and a lost shard names only its own modules.
  # The replay job above has already reported build, declaration comparison, axioms and nanoda.
  leanchecker:
    needs: [list, replay]
    if: always() && needs.list.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        name: ${{ fromJSON(needs.list.outputs.names) }}
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v5
      # Swap as in the replay job, and two leanchecker processes at a time instead of nproc: shard 4 of T1 in
      # run 45912270532 lost its runner after 47 min with no log (shards 1-3 passed in 5-8 min), so a shard
      # runs with more memory headroom, and says whether it restored the build or had to rebuild.
      - name: Free disk and add swap
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL || true
          sudo fallocate -l 8G /extra-swap && sudo chmod 600 /extra-swap && sudo mkswap /extra-swap && sudo swapon /extra-swap || echo "swap not added"
      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o elan-init.sh
          sh elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Read this line of the manifest
        run: |
          python3 - "${{ matrix.name }}" >> "$GITHUB_ENV" <<'PY'
          import sys
          for l in open('validation/external_replays.txt'):
              if l.startswith('#') or not l.strip(): continue
              f = [x.strip() for x in l.rstrip('\n').split('|')]
              f += [''] * (8 - len(f))
              if f[0] == sys.argv[1]:
                  for k, v in zip(['X_NAME', 'X_URL', 'X_REV', 'X_SUB', 'X_SOL', 'X_CHAL', 'X_THMS', 'X_EXTRA'], f):
                      print(f'{k}={v}')
          PY
      - name: Fetch the outside project at its pinned revision
        run: |
          mkdir outside && cd outside && git init -q && git remote add origin "$X_URL"
          git fetch -q --depth 1 origin "$X_REV" && git checkout -q FETCH_HEAD
      - name: Download the replay job's build (artifact of this run)
        id: art
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: ext-build-${{ matrix.name }}
          path: work/.lake/build
      - name: Restore the replay job's build (cache; only when this run has no artifact)
        id: restore
        if: steps.art.outcome != 'success'
        uses: actions/cache/restore@v4
        with:
          path: work/.lake/build
          key: ext-build-${{ matrix.name }}-${{ env.X_REV }}-${{ github.run_id }}
          restore-keys: ext-build-${{ matrix.name }}-${{ env.X_REV }}-
      - name: leanchecker on shard ${{ matrix.shard }} of 4
        run: |
          echo "build artifact: ${{ steps.art.outcome }}; cache fallback: exact key hit = '${{ steps.restore.outputs.cache-hit }}', key = '${{ steps.restore.outputs.cache-matched-key }}'"
          du -sh work/.lake/build 2>/dev/null || echo "no build directory restored: this shard rebuilds the closure"
          LC_JOBS=2 LC_SHARD=${{ matrix.shard }}/4 EXTRA="$X_EXTRA" bash scripts/external/replay.sh "outside/$X_SUB" work "$X_SOL" "$X_CHAL" $X_THMS
