name = "Formalization"
# Repair, run 2026-11-12T1628Z (annex LIV, see LEDGER): the checked job's axiom-audit step runs a bare `lake build`
# (lean-action v1.7.0, scripts/run_axiom_audit.sh), i.e. the default targets. With Work among them, every checked job
# whose lake cache missed rebuilt all of Work single-threaded inside the audit (4c7b118, run 43218463622: audit still
# building Work after 90 min, job cancelled at its 240-min limit). Work is built and judged by the `work` job
# (`lake build Work`, explicit target); every CI build names its target. No check changes.
defaultTargets = ["Checked"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.35.0"

# Promoted results only. CI fails on any sorry, non-standard axiom,
# kernel-replay failure or nanoda failure. Declarations live in namespace `Checked`.
[[lean_lib]]
name = "Checked"

# Drafts. sorry allowed. Declarations live in namespace `Work`.
[[lean_lib]]
name = "Work"
